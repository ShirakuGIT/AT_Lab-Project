<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Simple Markerless AR</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      button {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 16px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <button id="start-ar">Start AR</button>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
      import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";

      let camera, scene, renderer, controller;

      init();

      function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera();

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(
          ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] })
        );

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        controller = renderer.xr.getController(0);
        controller.addEventListener("select", onSelect);
        scene.add(controller);

        const reticleGeometry = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(
          -Math.PI / 2
        );
        const reticleMaterial = new THREE.MeshBasicMaterial({
          color: 0x00ff00,
        });
        const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        const hitTestSourcePromise = new Promise((resolve, reject) => {
          renderer.xr
            .getSession()
            .requestReferenceSpace("viewer")
            .then((refSpace) => {
              renderer.xr
                .getSession()
                .requestHitTestSource({ space: refSpace })
                .then(resolve)
                .catch(reject);
            });
        });

        renderer.setAnimationLoop((timestamp, frame) => {
          if (frame) {
            const referenceSpace = renderer.xr.getReferenceSpace();
            hitTestSourcePromise.then((source) => {
              const hitTestResults = frame.getHitTestResults(source);
              if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(referenceSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
              } else {
                reticle.visible = false;
              }
            });
          }

          renderer.render(scene, camera);
        });
      }

      function onSelect() {
        const geometry = new THREE.SphereGeometry(0.05, 32, 32);
        const material = new THREE.MeshStandardMaterial({
          color: Math.random() * 0xffffff,
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.setFromMatrixPosition(controller.matrixWorld);
        scene.add(mesh);
      }
    </script>
  </body>
</html>
