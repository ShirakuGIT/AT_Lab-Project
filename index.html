<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Room Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Basic reset, full-screen canvas */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: Arial, sans-serif;
    }
    /* HUD overlay for instructions and measurements */
    #hud {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    /* Button overlay to clear markers */
    #clearButton {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: #0066cc;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- HUD overlay -->
  <div id="hud">Tap on a surface to add a marker.
Perimeter: 0.00 m   |   Area: 0.00 m²</div>
  <!-- Clear markers button -->
  <button id="clearButton">Clear Markers</button>

  <!-- Main AR App Code -->
  <script type="module">
    // Import Three.js and ARButton via CDN.
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/webxr/ARButton.js';

    /********************
     * Global Variables
     ********************/
    let scene, camera, renderer, controller, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    // Array to hold marker objects (each is a THREE.Mesh)
    const markers = [];
    // A single THREE.Line that connects all markers.
    let lineMesh = null;
    // UI elements.
    const hudEl = document.getElementById("hud");
    const clearButton = document.getElementById("clearButton");

    /********************
     * AR & Scene Setup
     ********************/
    function init() {
      // Scene and camera.
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

      // Renderer with XR support.
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Basic light.
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Reticle for hit testing.
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Controller to listen for tap/select events.
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Add ARButton.
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      // Resize listener.
      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /********************
     * Marker & Measurement Functions
     ********************/
    // When the user taps (select event), add a marker at the reticle.
    function onSelect() {
      if (reticle.visible) {
        // Get position of the reticle.
        const pos = new THREE.Vector3();
        reticle.matrix.decompose(pos, new THREE.Quaternion(), new THREE.Vector3());
        // Create a small sphere as a marker.
        const geometry = new THREE.SphereGeometry(0.03, 16, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const marker = new THREE.Mesh(geometry, material);
        marker.position.copy(pos);
        scene.add(marker);
        markers.push(marker);
        updateLine();
        updateHUD();
      }
    }

    // Build or update a line connecting all markers.
    function updateLine() {
      // Remove previous line from the scene.
      if (lineMesh) {
        scene.remove(lineMesh);
      }
      if (markers.length < 2) return;
      // Create an array of positions.
      const points = markers.map(marker => marker.position.clone());
      // Optionally, if you want to close the polygon:
      // points.push(markers[0].position.clone());
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });
      lineMesh = new THREE.Line(geometry, material);
      scene.add(lineMesh);
    }

    // Compute the total perimeter and area (projecting marker positions onto X-Z plane).
    function computeMeasurements() {
      let perimeter = 0;
      let area = 0;
      if (markers.length < 2) return { perimeter, area };
      const pts = markers.map(marker => new THREE.Vector2(marker.position.x, marker.position.z));
      // Perimeter: sum of distances between consecutive points.
      for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        perimeter += pts[i].distanceTo(pts[j]);
      }
      // Area using the shoelace formula (if at least 3 points exist).
      if (pts.length >= 3) {
        let sum = 0;
        for (let i = 0; i < pts.length; i++) {
          const j = (i + 1) % pts.length;
          sum += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
        }
        area = Math.abs(sum) / 2;
      }
      return { perimeter, area };
    }

    // Update the HUD with measurements.
    function updateHUD() {
      const { perimeter, area } = computeMeasurements();
      hudEl.innerText = `Tap on a surface to add a marker.
Markers: ${markers.length}
Perimeter: ${perimeter.toFixed(2)} m   |   Area: ${area.toFixed(2)} m²`;
    }

    // Clear all markers and reset measurements.
    clearButton.addEventListener("click", () => {
      markers.forEach(marker => scene.remove(marker));
      markers.length = 0;
      if (lineMesh) {
        scene.remove(lineMesh);
        lineMesh = null;
      }
      updateHUD();
    });

    /********************
     * AR Render Loop
     ********************/
    let lastFrameTime = performance.now();
    function render(timestamp, frame) {
      const delta = timestamp - lastFrameTime;
      lastFrameTime = timestamp;

      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(refSpace => {
            session.requestHitTestSource({ space: refSpace }).then(source => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }
        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }

    /********************
     * Start the App
     ********************/
    init();
    renderer.setAnimationLoop(render);
  </script>
</body>
</html>
