<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Group Photo Booth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Basic reset and styling */
    body {
      margin: 0;
      font-family: sans-serif;
      background: #222;
      color: #ddd;
      overflow: hidden;
    }
    /* Container for file upload UI */
    #uploadUI {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    #uploadUI input {
      font-size: 16px;
    }
    /* Instruction message overlay */
    #message {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
    }
  </style>
  <!-- Load face-api.js (non-module) from CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <!-- File upload UI -->
  <div id="uploadUI">
    <div style="margin-bottom: 10px;">Upload a group photo to get started:</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <!-- Instruction / status message -->
  <div id="message">Please upload a group photo.</div>

  <!-- AR scene will be added dynamically by Three.js -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/webxr/ARButton.js';

    // ----------------------------
    // Global Variables and State
    // ----------------------------
    let scene, camera, renderer, controller, reticle;
    let hitTestSource = null, hitTestSourceRequested = false;
    // This texture will hold our augmented photo once processed.
    let augmentedTexture = null;
    // Flag to ensure the photo is placed only once.
    let placedAugmentedPhoto = false;

    // UI elements for file input and messages.
    const uploadUI = document.getElementById("uploadUI");
    const fileInput = document.getElementById("fileInput");
    const messageEl = document.getElementById("message");

    // ----------------------------
    // Initialize AR Scene
    // ----------------------------
    function initAR() {
      // Create scene and camera.
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
      
      // Create renderer.
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Basic lighting.
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Reticle for hit testing.
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Controller for tap/select events.
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Add AR button.
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      window.addEventListener('resize', onWindowResize, false);
      renderer.setAnimationLoop(render);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // When the user taps the screen, place the augmented photo (if available).
    function onSelect() {
      if (reticle.visible && augmentedTexture && !placedAugmentedPhoto) {
        // Create a plane geometry. We'll maintain the aspect ratio of the processed image.
        const imgWidth = augmentedTexture.image.width;
        const imgHeight = augmentedTexture.image.height;
        const aspect = imgHeight / imgWidth;
        const geometry = new THREE.PlaneGeometry(1, 1 * aspect);
        const material = new THREE.MeshBasicMaterial({ map: augmentedTexture, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geometry, material);
        // Position the plane at the reticle's location.
        mesh.position.setFromMatrixPosition(reticle.matrix);
        // Align the plane with the hit surface.
        mesh.quaternion.setFromRotationMatrix(reticle.matrix);
        scene.add(mesh);
        placedAugmentedPhoto = true;
        messageEl.innerText = "Augmented photo placed!";
      }
    }

    // AR render loop.
    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(refSpace => {
            session.requestHitTestSource({ space: refSpace }).then(source => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }
        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            if (!placedAugmentedPhoto && augmentedTexture) {
              messageEl.innerText = "Tap on a surface to place your augmented photo.";
            }
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }

    // ----------------------------
    // Photo Upload and Processing
    // ----------------------------
    // When the user selects a file, process it.
    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const img = new Image();
        img.onload = async () => {
          // Create an offscreen canvas to process the photo.
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          // Draw the uploaded photo.
          ctx.drawImage(img, 0, 0);
          
          // Run face detection on the canvas using face-api.js.
          // Use the TinyFaceDetector for fast processing.
          const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions())
                                        .withFaceLandmarks();
          // For each detected face, draw fun overlays.
          detections.forEach(det => {
            const box = det.detection.box;
            const landmarks = det.landmarks;
            
            // --- Draw Glasses Overlay ---
            const leftEye = landmarks.getLeftEye();
            const rightEye = landmarks.getRightEye();
            // Compute centers of both eyes.
            const leftCenter = {
              x: leftEye.reduce((sum, pt) => sum + pt.x, 0) / leftEye.length,
              y: leftEye.reduce((sum, pt) => sum + pt.y, 0) / leftEye.length
            };
            const rightCenter = {
              x: rightEye.reduce((sum, pt) => sum + pt.x, 0) / rightEye.length,
              y: rightEye.reduce((sum, pt) => sum + pt.y, 0) / rightEye.length
            };
            // Determine distance between eyes.
            const eyeDist = Math.hypot(rightCenter.x - leftCenter.x, rightCenter.y - leftCenter.y);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(leftCenter.x, leftCenter.y, eyeDist / 2.5, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(rightCenter.x, rightCenter.y, eyeDist / 2.5, 0, 2 * Math.PI);
            ctx.stroke();

            // --- Draw Hat Overlay ---
            // Draw a triangle above the face box.
            ctx.fillStyle = "blue";
            const hatHeight = box.height * 0.6;
            const hatWidth = box.width * 1.2;
            const centerX = box.x + box.width / 2;
            const topY = box.y - hatHeight;
            ctx.beginPath();
            ctx.moveTo(centerX, topY);
            ctx.lineTo(centerX - hatWidth / 2, box.y);
            ctx.lineTo(centerX + hatWidth / 2, box.y);
            ctx.closePath();
            ctx.fill();
          });
          
          // Create a Three.js texture from the augmented canvas.
          augmentedTexture = new THREE.CanvasTexture(canvas);
          // Hide the upload UI as we're done.
          uploadUI.style.display = "none";
          messageEl.innerText = "Augmented photo ready. Enter AR mode and tap on a surface to place it.";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ----------------------------
    // Model Loading for Face Detection
    // ----------------------------
    // Load models from a public repository.
    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri("https://justadudewhohacks.github.io/face-api.js/models/"),
      faceapi.nets.faceLandmark68Net.loadFromUri("https://justadudewhohacks.github.io/face-api.js/models/")
    ]).then(() => {
      console.log("Face detection models loaded.");
    });

    // ----------------------------
    // Initialize AR after page load
    // ----------------------------
    window.addEventListener("load", () => {
      // Show file input until the user uploads a photo.
      uploadUI.style.display = "block";
      messageEl.innerText = "Upload a group photo to begin.";
      initAR();
    });
  </script>
</body>
</html>
