<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Whiteboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Basic reset, full screen AR canvas */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }
    /* UI overlay messages and buttons */
    #ui {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 10px 15px;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
    }
    #buttons {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    #buttons button {
      font-size: 16px;
      padding: 8px 12px;
      margin: 0 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- UI overlay for instructions -->
  <div id="ui">Tap on a detected surface to anchor your whiteboard.</div>
  <!-- Buttons will appear once the board is placed -->
  <div id="buttons" style="display:none;">
    <button id="clearButton">Clear Board</button>
  </div>

  <!-- Main AR app code -->
  <script type="module">
    // Import Three.js and ARButton via CDN.
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/webxr/ARButton.js';

    /*********************
     * Global Variables
     *********************/
    let scene, camera, renderer, controller, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    // App mode: "setup" (whiteboard not placed yet) or "draw" (whiteboard placed)
    let appMode = "setup";
    // The whiteboard’s mesh and its supporting canvas.
    let boardMesh, boardCanvas, boardContext, boardTexture;
    // A flag to track drawing state.
    let drawing = false;
    // Last drawing position in canvas coordinates.
    let lastDrawPos = null;

    const uiEl = document.getElementById("ui");
    const buttonsEl = document.getElementById("buttons");
    const clearButton = document.getElementById("clearButton");

    /*********************
     * Initialization
     *********************/
    function init() {
      // Create scene and camera.
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // Create renderer with transparency and XR support.
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Add a hemisphere light.
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Create a reticle for hit testing in setup mode.
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Setup controller for tap events.
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Add ARButton.
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      // Listen for window resize.
      window.addEventListener('resize', onWindowResize, false);

      // Set up pointer events for drawing.
      renderer.domElement.addEventListener("pointerdown", onPointerDown);
      renderer.domElement.addEventListener("pointermove", onPointerMove);
      renderer.domElement.addEventListener("pointerup", onPointerUp);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /*********************
     * AR and Whiteboard Setup
     *********************/
    function onSelect() {
      // In setup mode, a tap places the whiteboard on the detected surface.
      if (appMode === "setup" && reticle.visible) {
        // Decompose the reticle's matrix to get position and orientation.
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        reticle.matrix.decompose(pos, quat, new THREE.Vector3());

        // Create an offscreen canvas for the whiteboard.
        boardCanvas = document.createElement('canvas');
        boardCanvas.width = 1024;
        boardCanvas.height = 512; // 2:1 aspect ratio (widescreen whiteboard)
        boardContext = boardCanvas.getContext('2d');
        // Fill it with white background.
        boardContext.fillStyle = "#ffffff";
        boardContext.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        boardTexture = new THREE.CanvasTexture(boardCanvas);
        boardTexture.minFilter = THREE.LinearFilter;

        // Create a plane geometry with matching aspect ratio.
        const boardWidth = 1.2; // meters (customizable)
        const boardHeight = boardWidth * (boardCanvas.height / boardCanvas.width);
        const geometry = new THREE.PlaneGeometry(boardWidth, boardHeight);
        const material = new THREE.MeshBasicMaterial({ map: boardTexture, side: THREE.DoubleSide });
        boardMesh = new THREE.Mesh(geometry, material);
        boardMesh.position.copy(pos);
        boardMesh.quaternion.copy(quat);

        // Adjust board rotation so it is vertical.
        boardMesh.rotateX(-Math.PI / 2);

        scene.add(boardMesh);
        appMode = "draw";
        // Update UI.
        uiEl.innerText = "Draw on your AR Whiteboard!";
        buttonsEl.style.display = "block";
      }
    }

    // ---------------------
    // Drawing Functionality
    // ---------------------
    // Convert pointer (screen) coordinates to normalized device coordinates.
    function getNDCCoordinates(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      return new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        - ((event.clientY - rect.top) / rect.height) * 2 + 1
      );
    }

    // Raycast from pointer event to whiteboard.
    function getBoardIntersection(event) {
      if (!boardMesh) return null;
      const ndc = getNDCCoordinates(event);
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(ndc, camera);
      const intersects = raycaster.intersectObject(boardMesh);
      return intersects.length ? intersects[0] : null;
    }

    function onPointerDown(event) {
      // Only allow drawing when whiteboard is placed.
      if (appMode !== "draw") return;
      const intersect = getBoardIntersection(event);
      if (intersect) {
        drawing = true;
        // Compute UV coordinates on the board (between 0 and 1).
        const uv = intersect.uv;
        // Convert uv to canvas pixel coordinates.
        const x = uv.x * boardCanvas.width;
        const y = (1 - uv.y) * boardCanvas.height;
        lastDrawPos = { x, y };
        // Begin a new path.
        boardContext.strokeStyle = "#000000";
        boardContext.lineWidth = 5;
        boardContext.beginPath();
        boardContext.moveTo(x, y);
      }
    }

    function onPointerMove(event) {
      if (!drawing) return;
      const intersect = getBoardIntersection(event);
      if (intersect) {
        const uv = intersect.uv;
        const x = uv.x * boardCanvas.width;
        const y = (1 - uv.y) * boardCanvas.height;
        boardContext.lineTo(x, y);
        boardContext.stroke();
        lastDrawPos = { x, y };
        boardTexture.needsUpdate = true;
      }
    }

    function onPointerUp(event) {
      if (drawing) {
        drawing = false;
      }
    }

    // Clear board drawing.
    clearButton.addEventListener("click", () => {
      if (boardContext && boardCanvas) {
        boardContext.fillStyle = "#ffffff";
        boardContext.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        boardTexture.needsUpdate = true;
      }
    });

    /*********************
     * AR Render Loop
     *********************/
    let lastFrameTime = performance.now();
    function render(timestamp, frame) {
      const delta = timestamp - lastFrameTime;
      lastFrameTime = timestamp;

      // In setup mode, update reticle position with hit testing.
      if (frame && appMode === "setup") {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(refSpace => {
            session.requestHitTestSource({ space: refSpace }).then(source => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }
        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }

    /*********************
     * Start the App
     *********************/
    init();
    renderer.setAnimationLoop(render);
  </script>
</body>
</html>
