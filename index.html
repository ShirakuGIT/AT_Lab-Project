<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Tape Measure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    body { margin: 0; overflow: hidden; }
    #reset {
      position: absolute;
      top: 10px; left: 10px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <button id="reset">Reset</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.141.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.141.0/examples/js/webxr/ARButton.js"></script>
  <script>
    let camera, scene, renderer;
    let controller;
    let reticle, hitTestSource = null, hitTestSourceRequested = false;
    const points = [], markers = [], lines = [], sprites = [];

    init();
    animate();

    function init() {
      // basic scene + camera + renderer
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // AR button
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      // reticle for placement
      const geometry = new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI/2);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // controller for tap events
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // reset button
      document.getElementById('reset').addEventListener('click', () => {
        points.length = 0;
        markers.forEach(m=>scene.remove(m)); markers.length = 0;
        lines.forEach(l=>scene.remove(l));     lines.length = 0;
        sprites.forEach(s=>scene.remove(s));   sprites.length = 0;
      });

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onSelect() {
      if (!reticle.visible) return;

      // get tap position
      const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);

      // marker sphere
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.01, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
      );
      sphere.position.copy(pos);
      scene.add(sphere);
      markers.push(sphere);

      // record point
      points.push(pos.clone());

      // if at least two, draw line+distance
      if (points.length >= 2) {
        const a = points[points.length - 2];
        const b = points[points.length - 1];
        const dist = a.distanceTo(b);

        // line
        const lineGeo = new THREE.BufferGeometry().setFromPoints([a, b]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00 });
        const line = new THREE.Line(lineGeo, lineMat);
        scene.add(line);
        lines.push(line);

        // text sprite at midpoint
        const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
        const sprite = makeTextSprite(dist.toFixed(2) + ' m');
        sprite.position.copy(mid);
        scene.add(sprite);
        sprites.push(sprite);
      }
    }

    function makeTextSprite(message) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = '48px sans-serif';
      ctx.fillStyle = 'white';
      ctx.fillText(message, 10, 64);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.2, 0.1, 1);
      return sprite;
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        const refSpace = renderer.xr.getReferenceSpace();

        // request hit-test source once
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        // perform hit test
        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(refSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
