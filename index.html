<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Drone Shooter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset margins and set up a full screen canvas */
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }
    /* Heads-up display: score, timer, and level info */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      z-index: 2;
      font-size: 1.2em;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 5px;
    }
    /* Center message for instructions */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.5em;
      z-index: 2;
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 5px;
    }
    /* Game over overlay */
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.5em;
      z-index: 2;
      text-align: center;
      background: rgba(0,0,0,0.9);
      padding: 20px 30px;
      border-radius: 10px;
      display: none;
    }
    button {
      font-size: 1em;
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- HUD: displays score, timer, and level -->
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="timer">Time: 60</div>
    <div id="level">Level: 1</div>
  </div>
  <!-- Instruction message -->
  <div id="message">Tap on a detected surface to place your arena</div>
  <!-- Game over overlay -->
  <div id="gameOver">
    Game Over!<br>
    Final Score: <span id="finalScore"></span><br>
    <button id="restartButton">Restart</button>
  </div>
  
  <!-- Main AR game code -->
  <script type="module">
    // Import Three.js and ARButton for WebXR from CDN
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/webxr/ARButton.js';

    // ------------------------
    // Basic Three.js Setup
    // ------------------------
    let camera, scene, renderer;
    let controller;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // -------------------------
    // Game State Variables
    // -------------------------
    const GAME_DURATION = 60; // seconds
    const ARENA_RADIUS = 2.0; // meters (arena is a circle around anchor)
    let gameState = "setup"; // "setup", "playing", "over"
    let gameAnchor = new THREE.Vector3();
    let gameStartTime = 0;
    let score = 0;
    let level = 1;
    // For enemy drones and particle effects:
    let enemies = [];
    let particles = [];
    let spawnIntervalId = null;
    let nextSpawnTime = 0;
    let spawnInterval = 1500; // milliseconds
    const MIN_SPAWN_INTERVAL = 600; // as difficulty increases, spawn faster

    // Raycaster for detecting hits (taps) on enemies
    const raycaster = new THREE.Raycaster();

    // ---------------------------
    // Initialization and Setup
    // ---------------------------
    init();
    animate();

    function init() {
      // Create scene and camera
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // Create WebGL renderer with XR support and transparency
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Add a hemisphere light for basic illumination
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Create a reticle (ring) for hit testing in setup mode
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Create a controller to receive tap/select events
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Add the AR button to the page for starting an AR session
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      // Listen for window resize events
      window.addEventListener('resize', onWindowResize, false);

      // Restart button: reloads the page to start fresh
      document.getElementById('restartButton').addEventListener('click', () => {
        window.location.reload();
      });
    }

    // ----------------------------------
    // Select (Tap) Handler for Controller
    // ----------------------------------
    function onSelect() {
      if (gameState === "setup") {
        // Setup: tap places the arena anchor
        if (reticle.visible) {
          gameAnchor.setFromMatrixPosition(reticle.matrix);
          startGame();
        }
      } else if (gameState === "playing") {
        // Playing: tap to shoot enemy drones!
        // Cast a ray from the center of the screen
        const tapPos = new THREE.Vector2(0, 0); // center of view
        raycaster.setFromCamera(tapPos, camera);
        // Check intersections against enemy meshes
        const intersects = raycaster.intersectObjects(enemies.map(e => e.mesh));
        if (intersects.length > 0) {
          // Hit! Trigger explosion effect and remove enemy.
          const enemyMesh = intersects[0].object;
          explodeEnemy(enemyMesh);
          // Remove enemy from array
          enemies = enemies.filter(e => e.mesh !== enemyMesh);
          scene.remove(enemyMesh);
          score += 1;
          updateHUD();
        }
      }
    }

    // -----------------------------
    // Start the Game after Anchor Set
    // -----------------------------
    function startGame() {
      gameState = "playing";
      gameStartTime = performance.now();
      document.getElementById('message').innerText = '';
      reticle.visible = false;

      // Start spawning enemies (drones)
      spawnIntervalId = setInterval(() => {
        spawnEnemy();
      }, spawnInterval);
      
      updateHUD();
    }

    // -----------------------------
    // Enemy Drone and Behavior
    // -----------------------------
    // Create an enemy drone: a small box with a propeller effect (rotating top)
    function spawnEnemy() {
      if (gameState !== "playing") return;

      // Create a group for the enemy drone
      const enemyGroup = new THREE.Group();

      // Main body: a box
      const bodyGeo = new THREE.BoxGeometry(0.15, 0.08, 0.15);
      const bodyMat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      enemyGroup.add(bodyMesh);

      // Propeller: a thin, flat box on top of the body
      const propGeo = new THREE.BoxGeometry(0.2, 0.02, 0.05);
      const propMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
      const propMesh = new THREE.Mesh(propGeo, propMat);
      propMesh.position.y = 0.07;
      enemyGroup.add(propMesh);

      // Random starting angle along the boundary of the arena
      const angle = Math.random() * Math.PI * 2;
      enemyGroup.position.set(
        gameAnchor.x + ARENA_RADIUS * Math.cos(angle),
        gameAnchor.y,
        gameAnchor.z + ARENA_RADIUS * Math.sin(angle)
      );

      // Set random velocity toward the center, with some lateral variation.
      const speed = 0.001 + Math.random() * 0.002; // meters per ms
      // Compute direction vector from spawn point toward a random point near the anchor
      const targetOffset = new THREE.Vector3((Math.random()-0.5)*0.8, 0, (Math.random()-0.5)*0.8);
      const targetPos = new THREE.Vector3().addVectors(gameAnchor, targetOffset);
      const direction = new THREE.Vector3().subVectors(targetPos, enemyGroup.position).normalize();
      const velocity = direction.multiplyScalar(speed);

      // Save enemy info in an object
      const enemy = {
        mesh: enemyGroup,
        velocity: velocity,
        propeller: propMesh,
        created: performance.now()
      };
      enemies.push(enemy);
      scene.add(enemyGroup);
    }

    // Animate enemy drones (movement, propeller spin, and arena bouncing)
    function updateEnemies(delta) {
      enemies.forEach(enemy => {
        // Move enemy based on its velocity and delta time
        enemy.mesh.position.addScaledVector(enemy.velocity, delta);
        // Simple bouncing: if enemy goes outside the arena, reflect its velocity
        const offset = new THREE.Vector3().subVectors(enemy.mesh.position, gameAnchor);
        if (offset.length() > ARENA_RADIUS) {
          const normal = offset.normalize();
          // Reflect velocity: v - 2*(v·n)*n
          const dot = enemy.velocity.dot(normal);
          enemy.velocity.sub(normal.multiplyScalar(2 * dot));
        }
        // Rotate the enemy group (simulate rolling) and spin the propeller faster.
        enemy.mesh.rotation.y += 0.005 * delta;
        enemy.propeller.rotation.z += 0.2 * delta;
      });
    }

    // ------------------------------------------
    // Particle Explosion Effect for Enemy Hit
    // ------------------------------------------
    function explodeEnemy(enemyMesh) {
      const explosionCount = 20;
      const origin = enemyMesh.position.clone();
      for (let i = 0; i < explosionCount; i++) {
        // Each particle is a small sphere.
        const geo = new THREE.SphereGeometry(0.01, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
        const particleMesh = new THREE.Mesh(geo, mat);
        particleMesh.position.copy(origin);
        // Assign a random velocity vector
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const speed = 0.002 + Math.random() * 0.003;
        const velocity = new THREE.Vector3(
          speed * Math.sin(phi) * Math.cos(theta),
          speed * Math.cos(phi),
          speed * Math.sin(phi) * Math.sin(theta)
        );
        // Save particle info
        particles.push({
          mesh: particleMesh,
          velocity: velocity,
          created: performance.now(),
          lifetime: 600 // milliseconds
        });
        scene.add(particleMesh);
      }
    }

    // Update particles: move them and remove after lifetime expires.
    function updateParticles(delta) {
      const now = performance.now();
      particles = particles.filter(particle => {
        const age = now - particle.created;
        if (age > particle.lifetime) {
          scene.remove(particle.mesh);
          return false;
        } else {
          particle.mesh.position.addScaledVector(particle.velocity, delta);
          // Optionally fade out particles by reducing opacity (if using a transparent material)
          return true;
        }
      });
    }

    // -----------------------------
    // HUD Updates: Score, Timer, Level
    // -----------------------------
    function updateHUD() {
      document.getElementById('score').innerText = `Score: ${score}`;
      if (gameState === "playing") {
        const elapsed = (performance.now() - gameStartTime) / 1000;
        const remaining = Math.max(0, Math.floor(GAME_DURATION - elapsed));
        document.getElementById('timer').innerText = `Time: ${remaining}`;
        document.getElementById('level').innerText = `Level: ${level}`;
      }
    }

    // ----------------------------
    // End the Game
    // ----------------------------
    function endGame() {
      gameState = "over";
      clearInterval(spawnIntervalId);
      enemies.forEach(e => scene.remove(e.mesh));
      enemies = [];
      // Show game over dialog with final score.
      document.getElementById('gameOver').style.display = 'block';
      document.getElementById('finalScore').innerText = score;
    }

    // -------------------------
    // Handling Window Resize
    // -------------------------
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // -------------------------
    // Main Animation Loop
    // -------------------------
    let lastFrameTime = performance.now();
    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      const delta = timestamp - lastFrameTime;
      lastFrameTime = timestamp;

      // Setup Mode: update reticle with hit testing.
      if (gameState === "setup") {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();
          if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then(refSpace => {
              session.requestHitTestSource({ space: refSpace }).then(source => {
                hitTestSource = source;
              });
            });
            session.addEventListener('end', () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });
            hitTestSourceRequested = true;
          }
          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length) {
              const hit = hitTestResults[0];
              reticle.visible = true;
              reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }
      }
      // Playing Mode: update enemy positions, particles, and check timer.
      if (gameState === "playing") {
        updateEnemies(delta);
        updateParticles(delta);
        updateHUD();
        const elapsed = (performance.now() - gameStartTime) / 1000;
        // Level progression: every 15 seconds, level up and spawn faster.
        if (Math.floor(elapsed / 15) + 1 > level) {
          level = Math.floor(elapsed / 15) + 1;
          spawnInterval = Math.max(MIN_SPAWN_INTERVAL, spawnInterval - 200);
          // Clear previous interval and start a new spawn schedule.
          clearInterval(spawnIntervalId);
          spawnIntervalId = setInterval(spawnEnemy, spawnInterval);
        }
        if (elapsed >= GAME_DURATION) {
          endGame();
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
