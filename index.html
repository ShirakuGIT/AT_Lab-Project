<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Social Filter & Face Fun</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Remove default margin/padding and set dark background */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    /* The video feed covers the entire background */
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* The canvas overlay for drawing AR filters */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }
    /* UI buttons container */
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 5px;
      color: white;
    }
    #ui button {
      margin: 4px;
      font-size: 16px;
      padding: 6px 12px;
      cursor: pointer;
      background: #444;
      border: none;
      border-radius: 4px;
      color: white;
    }
    #ui button.active {
      background: #06c;
    }
  </style>
  <!-- Load face-api.js from a CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <!-- Video element: shows the live camera feed -->
  <video id="video" autoplay muted playsinline></video>
  <!-- Canvas overlay: drawn AR filter graphics (glasses, hats, etc.) -->
  <canvas id="overlay"></canvas>
  <!-- Simple UI for selecting filters -->
  <div id="ui">
    <button id="noneBtn" class="active">None</button>
    <button id="glassesBtn">Glasses</button>
    <button id="hatBtn">Hat</button>
  </div>

  <script>
    // Global variables
    let currentMode = "none"; // "none", "glasses", or "hat"

    // UI button event listeners – toggle current filter mode and update active button styling.
    const btnNone = document.getElementById("noneBtn");
    const btnGlasses = document.getElementById("glassesBtn");
    const btnHat = document.getElementById("hatBtn");

    btnNone.addEventListener("click", () => { currentMode = "none"; setActive(btnNone); });
    btnGlasses.addEventListener("click", () => { currentMode = "glasses"; setActive(btnGlasses); });
    btnHat.addEventListener("click", () => { currentMode = "hat"; setActive(btnHat); });

    function setActive(activeButton) {
      [btnNone, btnGlasses, btnHat].forEach(btn => btn.classList.remove("active"));
      activeButton.classList.add("active");
    }

    // References to the video and canvas elements
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const context = canvas.getContext("2d");

    // When the video plays, adjust the canvas size to match.
    video.addEventListener("playing", () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    });

    // Load face-api.js models from the hosted directory.
    // The models here are loaded from a publicly available GitHub Pages repo.
    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri("https://justadudewhohacks.github.io/face-api.js/models/"),
      faceapi.nets.faceLandmark68Net.loadFromUri("https://justadudewhohacks.github.io/face-api.js/models/")
    ]).then(startVideo);

    // Start the video stream from the default camera.
    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: {} })
        .then((stream) => { video.srcObject = stream; })
        .catch(err => console.error("Error accessing webcam:", err));
    }

    // Main render loop: detect faces and draw filters if enabled.
    video.addEventListener("play", () => {
      async function onPlay() {
        if (video.paused || video.ended)
          return setTimeout(() => onPlay(), 100);

        // Run face detection with the tiny face detector and get landmarks.
        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();

        // Clear the canvas for this frame.
        context.clearRect(0, 0, canvas.width, canvas.height);

        // For each detection, apply the appropriate overlay if any.
        detections.forEach(detection => {
          if (currentMode === "glasses") {
            drawGlasses(detection);
          } else if (currentMode === "hat") {
            drawHat(detection);
          }
        });

        requestAnimationFrame(onPlay);
      }
      onPlay();
    });

    // Draw glasses overlay on detected face based on eye landmarks.
    function drawGlasses(detection) {
      const landmarks = detection.landmarks;
      const leftEye = landmarks.getLeftEye();
      const rightEye = landmarks.getRightEye();

      // Calculate the center of each eye.
      const leftEyeCenter = leftEye.reduce((sum, pt) => ({ x: sum.x + pt.x, y: sum.y + pt.y }), { x: 0, y: 0 });
      leftEyeCenter.x /= leftEye.length;
      leftEyeCenter.y /= leftEye.length;
      const rightEyeCenter = rightEye.reduce((sum, pt) => ({ x: sum.x + pt.x, y: sum.y + pt.y }), { x: 0, y: 0 });
      rightEyeCenter.x /= rightEye.length;
      rightEyeCenter.y /= rightEye.length;

      // Compute the distance between the eyes.
      const dx = rightEyeCenter.x - leftEyeCenter.x;
      const dy = rightEyeCenter.y - leftEyeCenter.y;
      const eyeDistance = Math.sqrt(dx * dx + dy * dy);

      // Draw two circles over the eyes.
      context.strokeStyle = "cyan";
      context.lineWidth = 4;
      context.beginPath();
      context.arc(leftEyeCenter.x, leftEyeCenter.y, eyeDistance / 2.5, 0, 2 * Math.PI);
      context.stroke();

      context.beginPath();
      context.arc(rightEyeCenter.x, rightEyeCenter.y, eyeDistance / 2.5, 0, 2 * Math.PI);
      context.stroke();

      // Draw a connecting line between the eyes.
      context.beginPath();
      context.moveTo(leftEyeCenter.x, leftEyeCenter.y);
      context.lineTo(rightEyeCenter.x, rightEyeCenter.y);
      context.stroke();
    }

    // Draw a hat overlay using the face detection bounding box.
    function drawHat(detection) {
      const box = detection.detection.box;
      // Define hat dimensions relative to the face box.
      const hatHeight = box.height * 0.6;
      const hatWidth = box.width * 1.2;
      const centerX = box.x + box.width / 2;
      const bottomY = box.y;
      const topY = box.y - hatHeight;

      // Draw a triangle for the hat.
      context.fillStyle = "magenta";
      context.beginPath();
      context.moveTo(centerX, topY);              // Tip of the hat
      context.lineTo(centerX - hatWidth / 2, bottomY); // Bottom-left corner
      context.lineTo(centerX + hatWidth / 2, bottomY); // Bottom-right corner
      context.closePath();
      context.fill();

      // Optionally, add a brim to the hat.
      context.fillStyle = "black";
      context.fillRect(centerX - hatWidth / 2, bottomY - 5, hatWidth, 10);
    }
  </script>
</body>
</html>
