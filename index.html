<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Sticky Notes & Measurement</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Full-screen canvas, basic reset and background */
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }
    /* UI overlay: buttons in top-right corner */
    #ui {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
    #ui button {
      font-size: 14px;
      margin: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
    /* Instruction text at the bottom-center */
    #instructions {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- UI overlay with mode buttons -->
  <div id="ui">
    <button id="addModeButton">Add Note</button>
    <button id="measureModeButton">Measure</button>
    <button id="clearButton">Clear All</button>
  </div>
  <div id="instructions">Mode: Add Note. Tap on a surface to place a sticky note.</div>

  <!-- Main AR App code -->
  <script type="module">
    // Import Three.js and ARButton as ES modules from a CDN
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js';
    import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/webxr/ARButton.js';

    // Global variables and state
    let scene, camera, renderer, controller, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // Two primary modes: "add" (to pin a sticky note) and "measure" (to select notes and measure distance)
    let currentMode = "add";
    // Array of placed sticky notes
    let stickyNotes = [];
    let noteCount = 0;
    // When two notes are selected in measure mode, a sprite shows the measured distance
    let measureSprite = null;
    const raycaster = new THREE.Raycaster();

    // UI elements
    const addModeButton = document.getElementById('addModeButton');
    const measureModeButton = document.getElementById('measureModeButton');
    const clearButton = document.getElementById('clearButton');
    const instructionsEl = document.getElementById('instructions');

    // Set up UI button event listeners
    addModeButton.addEventListener('click', () => {
      currentMode = "add";
      instructionsEl.innerText = "Mode: Add Note. Tap on a surface to place a sticky note.";
      // Deselect all notes (if any) and remove a measurement if present.
      stickyNotes.forEach(note => {
        if(note.selected) {
          note.selected = false;
          note.update();
        }
      });
      removeMeasureSprite();
    });
    measureModeButton.addEventListener('click', () => {
      currentMode = "measure";
      instructionsEl.innerText = "Mode: Measure. Tap on sticky notes to select them for measurement.";
      stickyNotes.forEach(note => {
        if(note.selected) {
          note.selected = false;
          note.update();
        }
      });
      removeMeasureSprite();
    });
    clearButton.addEventListener('click', () => {
      // Remove all sticky notes and the measure sprite from the scene.
      stickyNotes.forEach(note => {
        scene.remove(note.mesh);
      });
      stickyNotes = [];
      noteCount = 0;
      removeMeasureSprite();
    });

    // Utility: remove the measure sprite if it exists.
    function removeMeasureSprite() {
      if(measureSprite) {
        scene.remove(measureSprite);
        measureSprite = null;
      }
    }

    // Create a sticky note at a given position with preset text.
    function createStickyNote(position, text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      
      // Function to draw the sticky note, using different styles if selected.
      function drawNote(selected) {
        // Background: a typical sticky-note yellow tint.
        ctx.fillStyle = selected ? '#fffa90' : '#fff8c6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Border: thicker red when selected, thinner yellow otherwise.
        ctx.strokeStyle = selected ? '#ff0000' : '#cccc00';
        ctx.lineWidth = selected ? 8 : 4;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        // Draw centered text.
        ctx.font = '32px sans-serif';
        ctx.fillStyle = '#000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      }
      
      drawNote(false);
      
      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      const geometry = new THREE.PlaneGeometry(0.3, 0.3);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);
      
      return {
        id: noteCount++,
        text: text,
        mesh: mesh,
        selected: false,
        canvas: canvas,
        ctx: ctx,
        texture: texture,
        update: function() {
          drawNote(this.selected);
          this.texture.needsUpdate = true;
        },
        toggle: function() {
          this.selected = !this.selected;
          this.update();
        }
      };
    }

    // When exactly two notes are selected, update or create a sprite to show the distance.
    function updateMeasurementDisplay() {
      const selectedNotes = stickyNotes.filter(note => note.selected);
      if (selectedNotes.length === 2) {
        const pos1 = selectedNotes[0].mesh.position;
        const pos2 = selectedNotes[1].mesh.position;
        const distance = pos1.distanceTo(pos2);
        const midPoint = new THREE.Vector3().addVectors(pos1, pos2).multiplyScalar(0.5);
        const text = distance.toFixed(2) + " m";
        if (!measureSprite) {
          measureSprite = createTextSprite(text);
          scene.add(measureSprite);
        } else {
          updateTextSprite(measureSprite, text);
        }
        measureSprite.position.copy(midPoint);
      } else {
        removeMeasureSprite();
      }
    }

    // Create a sprite that displays text (used for distance measurement).
    function createTextSprite(message) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const context = canvas.getContext('2d');
      context.fillStyle = "rgba(255,255,255,0.8)";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.font = "48px sans-serif";
      context.fillStyle = "#000";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(message, canvas.width / 2, canvas.height / 2);
      
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(0.5, 0.25, 1);
      sprite.userData = { canvas: canvas, context: context, texture: texture };
      return sprite;
    }

    // Update an existing measurement sprite with new text.
    function updateTextSprite(sprite, message) {
      const canvas = sprite.userData.canvas;
      const context = sprite.userData.context;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "rgba(255,255,255,0.8)";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.font = "48px sans-serif";
      context.fillStyle = "#000";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(message, canvas.width / 2, canvas.height / 2);
      sprite.userData.texture.needsUpdate = true;
    }

    // Three.js / WebXR initialization
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // Create a reticle using a ring geometry—this shows where AR hit testing finds surfaces.
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Set up the controller to listen for tap/select events.
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Add ARButton to enter AR mode.
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      window.addEventListener('resize', onWindowResize, false);
    }

    // Handle window resize events.
    function onWindowResize() {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Controller tap/select event handler.
    function onSelect() {
      if (currentMode === "add") {
        // In "add" mode, if the reticle is visible, create a new sticky note at that location.
        if (reticle.visible) {
          const pos = new THREE.Vector3();
          reticle.matrix.decompose(pos, new THREE.Quaternion(), new THREE.Vector3());
          const note = createStickyNote(pos, "Note " + (noteCount + 1));
          stickyNotes.push(note);
          scene.add(note.mesh);
        }
      } else if (currentMode === "measure") {
        // In "measure" mode, cast a ray from the center of the screen to detect sticky notes.
        const tapPos = new THREE.Vector2(0, 0);  // center of the view
        raycaster.setFromCamera(tapPos, camera);
        const objects = stickyNotes.map(note => note.mesh);
        const intersects = raycaster.intersectObjects(objects);
        if(intersects.length > 0) {
          // Toggle selection on the intersected note.
          const hitMesh = intersects[0].object;
          const note = stickyNotes.find(n => n.mesh === hitMesh);
          if(note) {
            note.toggle();
            updateMeasurementDisplay();
          }
        }
      }
    }

    // Animation loop: update hit testing and orient notes to face the camera.
    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(refSpace => {
            session.requestHitTestSource({ space: refSpace }).then(source => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }
        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      // Ensure sticky notes always face the user.
      stickyNotes.forEach(note => {
        note.mesh.lookAt(camera.position);
      });
      renderer.render(scene, camera);
    }

    init();
    animate();
  </script>
</body>
</html>
